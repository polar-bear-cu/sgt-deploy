x-logging: &prod-logging
  driver: journald
  options:
    tag: "{{.Name}}"

services:
  caddy:
    image: caddy:2.11-alpine
    logging: *prod-logging
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - gateway

  mongo:
    command: ["mongod", "--wiredTigerCacheSizeGB", "0.3"]
    logging: *prod-logging

  mailhog:
    ports:
      - "127.0.0.1:8025:8025"
    logging: *prod-logging

  postgres-subscription:
    logging: *prod-logging
  postgres-user:
    logging: *prod-logging
  postgres-auth:
    logging: *prod-logging
  migrate-subscription:
    logging: *prod-logging
  migrate-user:
    logging: *prod-logging
  migrate-auth:
    logging: *prod-logging
  rabbitmq:
    logging: *prod-logging
  subscription-service:
    logging: *prod-logging
  user-service:
    logging: *prod-logging
  auth-service:
    logging: *prod-logging
  report-service:
    logging: *prod-logging
  noti-service:
    logging: *prod-logging
  scheduler:
    logging: *prod-logging
  frontend:
    logging: *prod-logging
  envoy:
    logging: *prod-logging
  gateway:
    logging: *prod-logging

volumes:
  caddy_data:
  caddy_config:
