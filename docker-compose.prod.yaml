services:
  caddy:
    image: caddy:2.11-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - gateway

  mongo:
    command: ["mongod", "--wiredTigerCacheSizeGB", "0.3"]

  mailhog:
    ports:
      - "127.0.0.1:8025:8025"

volumes:
  caddy_data:
  caddy_config:
