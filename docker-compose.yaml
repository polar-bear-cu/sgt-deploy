services:
  postgres-subscription:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${SUBSCRIPTION_DB_PASSWORD:?set SUBSCRIPTION_DB_PASSWORD}
      POSTGRES_DB: subscriptions
      TZ: Asia/Bangkok
    volumes:
      - pgdata-subscription:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

  postgres-user:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${USER_DB_PASSWORD:?set USER_DB_PASSWORD}
      POSTGRES_DB: users
      TZ: Asia/Bangkok
    volumes:
      - pgdata-user:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

  postgres-auth:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${AUTH_DB_PASSWORD:?set AUTH_DB_PASSWORD}
      POSTGRES_DB: auth
      TZ: Asia/Bangkok
    volumes:
      - pgdata-auth:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

  migrate-subscription:
    image: ghcr.io/polar-bear-cu/sgt-subscription-service-migrate:${SUBSCRIPTION_TAG:?set SUBSCRIPTION_TAG}
    command:
      [
        "-path",
        "/migrations",
        "-database",
        "postgres://postgres:${SUBSCRIPTION_DB_PASSWORD:?set SUBSCRIPTION_DB_PASSWORD}@postgres-subscription:5432/subscriptions?sslmode=disable",
        "up",
      ]
    depends_on:
      postgres-subscription:
        condition: service_healthy

  migrate-user:
    image: ghcr.io/polar-bear-cu/sgt-user-service-migrate:${USER_TAG:?set USER_TAG}
    command:
      [
        "-path",
        "/migrations",
        "-database",
        "postgres://postgres:${USER_DB_PASSWORD:?set USER_DB_PASSWORD}@postgres-user:5432/users?sslmode=disable",
        "up",
      ]
    depends_on:
      postgres-user:
        condition: service_healthy

  migrate-auth:
    image: ghcr.io/polar-bear-cu/sgt-auth-service-migrate:${AUTH_TAG:?set AUTH_TAG}
    command:
      [
        "-path",
        "/migrations",
        "-database",
        "postgres://postgres:${AUTH_DB_PASSWORD:?set AUTH_DB_PASSWORD}@postgres-auth:5432/auth?sslmode=disable",
        "up",
      ]
    depends_on:
      postgres-auth:
        condition: service_healthy

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      TZ: Asia/Bangkok
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?set RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      - rabbitmqdata:/var/lib/rabbitmq

  mongo:
    image: mongo:7
    environment:
      TZ: Asia/Bangkok
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      - mongodata:/data/db

  mailhog:
    image: mailhog/mailhog

  subscription-service:
    image: ghcr.io/polar-bear-cu/sgt-subscription-service:${SUBSCRIPTION_TAG:?set SUBSCRIPTION_TAG}
    environment:
      PORT: 8080
      GRPC_PORT: 50051
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      ENABLE_SWAGGER: "false"
      DB_HOST: postgres-subscription
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: ${SUBSCRIPTION_DB_PASSWORD:?set SUBSCRIPTION_DB_PASSWORD}
      DB_NAME: subscriptions
      DB_SSLMODE: disable
    depends_on:
      migrate-subscription:
        condition: service_completed_successfully

  user-service:
    image: ghcr.io/polar-bear-cu/sgt-user-service:${USER_TAG:?set USER_TAG}
    environment:
      PORT: 8080
      GRPC_PORT: 50052
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      ENABLE_SWAGGER: "false"
      DB_HOST: postgres-user
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: ${USER_DB_PASSWORD:?set USER_DB_PASSWORD}
      DB_NAME: users
      DB_SSLMODE: disable
    depends_on:
      migrate-user:
        condition: service_completed_successfully

  auth-service:
    image: ghcr.io/polar-bear-cu/sgt-auth-service:${AUTH_TAG:?set AUTH_TAG}
    environment:
      PORT: 8080
      GRPC_PORT: 50053
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      ACCESS_TTL: 15m
      REFRESH_TTL: 720h
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_REDIRECT_URL: http://localhost:8000/api/v1/auth/google/callback
      PUBLIC_URL: http://localhost:8000
      USER_SERVICE_ADDR: user-service:50052
      ENABLE_SWAGGER: "false"
      DB_HOST: postgres-auth
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: ${AUTH_DB_PASSWORD:?set AUTH_DB_PASSWORD}
      DB_NAME: auth
      DB_SSLMODE: disable
      COOKIE_DOMAIN: ""
      COOKIE_SECURE: "false"
      COOKIE_SAMESITE: "lax"
    depends_on:
      migrate-auth:
        condition: service_completed_successfully
      user-service:
        condition: service_started

  report-service:
    image: ghcr.io/polar-bear-cu/sgt-report-service:${REPORT_TAG:?set REPORT_TAG}
    environment:
      PORT: 8080
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      SUBSCRIPTION_SERVICE_ADDR: subscription-service:50051
      ENABLE_SWAGGER: "false"
    depends_on:
      subscription-service:
        condition: service_started

  noti-service:
    image: ghcr.io/polar-bear-cu/sgt-noti-service:${NOTI_TAG:?set NOTI_TAG}
    environment:
      PORT: 8080
      SMTP_HOST: mailhog
      SMTP_PORT: 1025
      SMTP_FROM: noreply@subglutee.local
      MONGO_URI: mongodb://mongo:27017
      MONGO_DB_NAME: noti
      RABBITMQ_URL: amqp://${RABBITMQ_USER:?set RABBITMQ_USER}:${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD}@rabbitmq:5672/
    depends_on:
      mongo:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  scheduler:
    image: ghcr.io/polar-bear-cu/sgt-scheduler:${SCHEDULER_TAG:?set SCHEDULER_TAG}
    restart: unless-stopped
    environment:
      PORT: 8080
      ROLLOVER_CRON: "0 0 * * *"
      REMINDER_CRON: "0 9 * * *"
      CLEANUP_CRON: "0 0 * * *"
      PUBLIC_URL: http://localhost:8000
      SUBSCRIPTION_SERVICE_ADDR: subscription-service:50051
      USER_SERVICE_ADDR: user-service:50052
      AUTH_SERVICE_ADDR: auth-service:50053
      RABBITMQ_URL: amqp://${RABBITMQ_USER:?set RABBITMQ_USER}:${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD}@rabbitmq:5672/
    depends_on:
      subscription-service:
        condition: service_started
      user-service:
        condition: service_started
      auth-service:
        condition: service_started
      rabbitmq:
        condition: service_healthy

  frontend:
    image: ghcr.io/polar-bear-cu/sgt-frontend:${FRONTEND_TAG:?set FRONTEND_TAG}

  envoy:
    image: envoyproxy/envoy:v1.31-latest
    volumes:
      - ./envoy.yaml:/etc/envoy/envoy.yaml:ro
    depends_on:
      - user-service

  gateway:
    image: ghcr.io/polar-bear-cu/sgt-gateway:${GATEWAY_TAG:?set GATEWAY_TAG}
    depends_on:
      - auth-service
      - user-service
      - subscription-service
      - report-service
      - frontend
      - envoy

volumes:
  pgdata-subscription:
  pgdata-user:
  pgdata-auth:
  rabbitmqdata:
  mongodata:
