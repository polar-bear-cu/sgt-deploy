services:
  postgres-subscription:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: subscriptions
      TZ: Asia/Bangkok
    volumes:
      - pgdata-subscription:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

  postgres-user:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: users
      TZ: Asia/Bangkok
    volumes:
      - pgdata-user:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

  postgres-auth:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: auth
      TZ: Asia/Bangkok
    volumes:
      - pgdata-auth:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

  migrate-subscription:
    image: migrate/migrate:v4.18.1
    volumes:
      - ../sgt-subscription-service/migrations:/migrations:ro
    command:
      [
        "-path", "/migrations",
        "-database", "postgres://postgres:postgres@postgres-subscription:5432/subscriptions?sslmode=disable",
        "up",
      ]
    depends_on:
      postgres-subscription:
        condition: service_healthy

  migrate-user:
    image: migrate/migrate:v4.18.1
    volumes:
      - ../sgt-user-service/migrations:/migrations:ro
    command:
      [
        "-path", "/migrations",
        "-database", "postgres://postgres:postgres@postgres-user:5432/users?sslmode=disable",
        "up",
      ]
    depends_on:
      postgres-user:
        condition: service_healthy

  migrate-auth:
    image: migrate/migrate:v4.18.1
    volumes:
      - ../sgt-auth-service/migrations:/migrations:ro
    command:
      [
        "-path", "/migrations",
        "-database", "postgres://postgres:postgres@postgres-auth:5432/auth?sslmode=disable",
        "up",
      ]
    depends_on:
      postgres-auth:
        condition: service_healthy

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      TZ: Asia/Bangkok
    ports:
      - "15672:15672" # management ui
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      - rabbitmqdata:/var/lib/rabbitmq

  mongo:
    image: mongo:7
    environment:
      TZ: Asia/Bangkok
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      - mongodata:/data/db

  mailhog:
    image: mailhog/mailhog
    ports:
      - "8025:8025" # web ui

  subscription-service:
    build: ../sgt-subscription-service
    image: sgt-subscription-service:local
    environment:
      PORT: 8080
      GRPC_PORT: 50051
      JWT_SECRET: ${JWT_SECRET}
      ENABLE_SWAGGER: "false"
      DB_HOST: postgres-subscription
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: subscriptions
      DB_SSLMODE: disable
    depends_on:
      migrate-subscription:
        condition: service_completed_successfully

  user-service:
    build: ../sgt-user-service
    image: sgt-user-service:local
    environment:
      PORT: 8080
      GRPC_PORT: 50052
      JWT_SECRET: ${JWT_SECRET}
      ENABLE_SWAGGER: "false"
      DB_HOST: postgres-user
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: users
      DB_SSLMODE: disable
    depends_on:
      migrate-user:
        condition: service_completed_successfully

  auth-service:
    build: ../sgt-auth-service
    image: sgt-auth-service:local
    environment:
      PORT: 8080
      JWT_SECRET: ${JWT_SECRET}
      ACCESS_TTL: 15m
      REFRESH_TTL: 720h
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_REDIRECT_URL: http://localhost:8000/api/v1/auth/google/callback
      PUBLIC_URL: http://localhost:8000
      USER_SERVICE_ADDR: user-service:50052
      ENABLE_SWAGGER: "false"
      DB_HOST: postgres-auth
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: auth
      DB_SSLMODE: disable
    depends_on:
      migrate-auth:
        condition: service_completed_successfully
      user-service:
        condition: service_started

volumes:
  pgdata-subscription:
  pgdata-user:
  pgdata-auth:
  rabbitmqdata:
  mongodata:
